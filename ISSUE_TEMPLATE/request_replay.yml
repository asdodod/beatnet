name: Request Replay Generation
description: Enter a BeatSaver map ID to generate a replay
title: "[Replay] "
labels: ["request-replay"]
body:
  - type: markdown
    attributes:
      value: "Hi! Provide a map key from [BeatSaver](https://beatsaver.com) (e.g., `1a2b`), and the AI will generate a replay for it."
  - type: input
    id: map_id
    attributes:
      label: BeatSaver Map Key
      description: Map ID (via URL or Copy BSR button)
      placeholder: "Example: 1a2b"
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: Which difficulty to generate?
      options:
        - ExpertPlus
        - Expert
        - Hard
        - Normal
        - Easy
    validations:
      required: true
